server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Позволяем SPA‑роутинг (любая 404 -> index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические ассеты кэшируем на год
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
